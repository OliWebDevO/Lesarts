            - generic [ref=f11e302]: Le détail fait la différence
            - paragraph [ref=f11e303]: Chaque millimètre compte. Nous travaillons avec des matériaux d'exception pour garantir un encadrement qui préserve et met en valeur votre œuvre dans le temps.
          - listitem [ref=f11e304]:
            - generic [ref=f11e305]: L'art de mettre en valeur
            - paragraph [ref=f11e306]: Encadrer, c'est créer un dialogue entre l'œuvre et son environnement. Nous guidons ce choix avec sensibilité et expertise, pour que chaque cadre raconte une histoire.
          - listitem [ref=f11e307]:
            - generic [ref=f11e308]: L'humain au cœur du métier
            - paragraph [ref=f11e309]: Derrière chaque encadrement, il y a une histoire. Nous prenons le temps de comprendre la vôtre avant de donner le premier coup de cutter.
