            - paragraph [ref=f1e402]: Chaque millimètre compte. Nous travaillons avec des matériaux d'exception pour garantir un encadrement qui préserve et met en valeur votre œuvre dans le temps.
          - listitem [ref=f1e403]:
            - generic [ref=f1e404]: L'art de mettre en valeur
            - paragraph [ref=f1e405]: Encadrer, c'est créer un dialogue entre l'œuvre et son environnement. Nous guidons ce choix avec sensibilité et expertise, pour que chaque cadre raconte une histoire.
