            - paragraph [ref=f2e402]: Chaque millimètre compte. Nous travaillons avec des matériaux d'exception pour garantir un encadrement qui préserve et met en valeur votre œuvre dans le temps.
          - listitem [ref=f2e403]:
            - generic [ref=f2e404]: L'art de mettre en valeur
            - paragraph [ref=f2e405]: Encadrer, c'est créer un dialogue entre l'œuvre et son environnement. Nous guidons ce choix avec sensibilité et expertise, pour que chaque cadre raconte une histoire.
