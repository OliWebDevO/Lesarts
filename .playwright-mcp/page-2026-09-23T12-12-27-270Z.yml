            - generic [ref=f5e375]: Ixelles, Bruxelles
            - paragraph [ref=f5e376]: "Nous chérissons chaque œuvre confiée. Votre vision, notre expertise : ensemble, nous lui donnons le cadre qu'elle mérite. Depuis notre atelier de la rue du Bailli, chaque réalisation est une histoire."
