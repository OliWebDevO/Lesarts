            - generic [ref=f5e392]: Le détail fait la différence
            - paragraph [ref=f5e393]: Chaque millimètre compte. Nous travaillons avec des matériaux d'exception pour garantir un encadrement qui préserve et met en valeur votre œuvre dans le temps.
          - listitem [ref=f5e394]:
            - generic [ref=f5e395]: L'art de mettre en valeur
            - paragraph [ref=f5e396]: Encadrer, c'est créer un dialogue entre l'œuvre et son environnement. Nous guidons ce choix avec sensibilité et expertise, pour que chaque cadre raconte une histoire.
          - listitem [ref=f5e397]:
            - generic [ref=f5e398]: L'humain au cœur du métier
            - paragraph [ref=f5e399]: Derrière chaque encadrement, il y a une histoire. Nous prenons le temps de comprendre la vôtre avant de donner le premier coup de cutter.
